name: Playwright Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# CRITICAL: This grants GitHub Actions write permissions to deploy to your gh-pages branch
permissions:
  contents: write

jobs:
  playwright-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Allow unsecure Node version
        run: ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true
      - name: Install Playwright Browsers
        run: npx playwright install
      - name: Run Playwright tests
        run: npm run test:dev
      - name: Allure report generation
        run: npm run report:allure:generate
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report-allure-report
          path: test-report/allure-report/
          retention-days: 10
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report-playwright-report
          path: test-report/playwright-report/
          retention-days: 10

      # NEW STEP: Build staging folder and copy the external template HTML file
      - name: Combine reports for GitHub Pages
        if: always()
        run: sh ./.github/workflows/scripts/report-combiner.sh

      - name: Deploy HTML reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-report/combined-pages
      - name: Display report URL
        if: always()
        run: | 
          echo "Reports deployed to GitHub Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"